<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="직원 관리">
<meta name="theme-color" content="#f5f6f8">
<title>매장별 직원 리스트</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#8f1f1f; --red2:#b23b3b; --gold:#c9a24a;
    --cream:#faf6ee; --ink:#1c1c1c; --sub:#8a7f6a;
    --line:#e6ded0; --white:#ffffff; --green:#2f7d4f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans KR',sans-serif;padding-bottom:110px;}
  header{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:18px 16px 20px;text-align:center;}
  header .title{font-size:21px;font-weight:900;letter-spacing:1px;}
  header .sub{font-size:12px;opacity:.85;margin-top:4px;}

  .storeTabs{display:flex;gap:6px;margin:14px 14px 0;overflow-x:auto;scrollbar-width:none;}
  .storeTabs::-webkit-scrollbar{display:none;}
  .storeTab{flex:1 0 auto;min-width:62px;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:15px;font-weight:900;color:#9a9182;}
  .storeTab.on{background:var(--red);border-color:var(--red);color:#fff;}
  .summary{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:10px 14px 14px;}
  .sumBox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 2px;text-align:center;font-family:inherit;color:inherit;}
  .sumBox:not([disabled]){border-color:#e3d3a8;box-shadow:0 1px 0 rgba(201,162,74,.35);}
  .sumBox.on{background:var(--red);border-color:var(--red);}
  .sumBox.on b,.sumBox.on span{color:#fff;}
  .sumBox b{display:block;font-size:19px;font-weight:900;color:var(--red);}
  .sumBox span{font-size:11px;color:var(--sub);font-weight:700;}

  .section{margin:14px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .secHead{display:flex;align-items:center;gap:10px;padding:13px 14px;background:rgba(143,31,31,.06);border-bottom:1px solid var(--line);}
  .secHead .emo{font-size:26px;line-height:1;}
  .secHead .name{font-size:17px;font-weight:900;color:var(--red);flex:1;}
  .secHead .cnt{font-size:12px;font-weight:800;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px;}

  .row{display:flex;align-items:center;gap:4px;padding:7px 6px;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .nameBtn{display:flex;align-items:center;gap:4px;flex:1;min-width:0;border:0;background:none;padding:6px 0;font-family:inherit;text-align:left;}
  .nameBtn .emo{font-size:16px;flex-shrink:0;}
  .nameBtn .nm{min-width:2.6em;font-size:14.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nameBtn .nm.empty{color:#b0a794;font-weight:500;}
  .nameBtn .memoTag{font-size:13px;flex-shrink:0;}
  .checks{display:flex;gap:4px;flex-shrink:0;}
  .chk{display:flex;align-items:center;gap:3px;padding:7px 3px;border-radius:8px;border:1.5px solid var(--line);background:var(--cream);font-family:inherit;font-size:11px;font-weight:800;color:#9a9182;white-space:nowrap;}
  .chk .box{width:13px;height:13px;border-radius:4px;border:2px solid #c9bfab;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;}
  .chk.on{border-color:var(--green);background:rgba(47,125,79,.08);color:var(--green);}
  .chk.on .box{background:var(--green);border-color:var(--green);}

  .att{flex-shrink:0;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:11px;font-weight:900;color:#b0a794;padding:0;line-height:1.1;}
  .att.on{background:#1f6fb2;border-color:#1f6fb2;color:#fff;}
  .dateBar{margin:10px 14px 0;text-align:center;font-size:12.5px;font-weight:800;color:var(--sub);}
  .row.left{opacity:.45;}
  .tag{flex-shrink:0;font-size:9.5px;font-weight:900;border-radius:5px;padding:2px 4px;}
  .tag.new{background:rgba(31,111,178,.12);color:#1f6fb2;}
  .tag.out{background:rgba(178,59,59,.12);color:#b23b3b;}
  .monthBox{margin:0 14px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .monthHead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(201,162,74,.12);}
  .monthHead button{border:0;background:#fff;border:1px solid var(--line);border-radius:8px;width:36px;height:32px;font-size:15px;font-weight:900;color:var(--red);}
  .monthHead .ttl{font-size:15px;font-weight:900;color:var(--red);}
  .monthBody{display:grid;grid-template-columns:1fr 1fr;}
  .monthCol{padding:10px 12px;font-size:13px;}
  .monthCol + .monthCol{border-left:1px solid var(--line);}
  .monthCol h4{margin:0 0 6px;font-size:13px;font-weight:900;}
  .monthCol.in h4{color:#1f6fb2;} .monthCol.out h4{color:#b23b3b;}
  .monthCol .it{padding:3px 0;font-weight:700;line-height:1.35;}
  .monthCol .it small{display:block;color:var(--sub);font-weight:500;font-size:11px;}
  .monthCol .none{color:#b0a794;font-size:12px;}
  .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  input[type=date]{width:100%;padding:11px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);font-size:15px;font-family:inherit;color:var(--ink);}
  .io{flex-shrink:0;width:46px;height:38px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:10.5px;font-weight:900;color:#9a9182;padding:0;line-height:1.15;}
  .io.in{background:#1f6fb2;border-color:#1f6fb2;color:#fff;}
  .io.out{background:#b23b3b;border-color:#b23b3b;color:#fff;}
  .ioBig{display:block;width:100%;padding:17px 14px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line);background:#fff;font-family:inherit;font-size:17px;font-weight:900;text-align:left;}
  .ioBig small{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-top:3px;}
  .ioBig.join{border-color:#1f6fb2;color:#1f6fb2;background:rgba(31,111,178,.06);}
  .ioBig.leave{border-color:#b23b3b;color:#b23b3b;background:rgba(178,59,59,.06);}
  .ioBig.undo{border-style:dashed;color:var(--sub);font-size:14px;padding:13px 14px;}
  .logBox{margin:0 14px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .logHead{padding:10px 12px;font-size:14px;font-weight:900;color:var(--red);background:rgba(143,31,31,.06);display:flex;justify-content:space-between;align-items:center;}
  .logHead button{border:0;background:none;font-family:inherit;font-size:12px;font-weight:800;color:var(--sub);}
  .logItem{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px;}
  .logItem .tp{flex-shrink:0;font-size:11px;font-weight:900;border-radius:6px;padding:3px 7px;color:#fff;}
  .logItem .tp.join{background:#1f6fb2;} .logItem .tp.leave{background:#b23b3b;}
  .logItem .nm{flex:1;font-weight:800;}
  .logItem .dt{font-size:12px;color:var(--sub);font-weight:700;text-align:right;}
  .tag.off{background:rgba(120,90,160,.14);color:#6b4f9a;}
  .att.offday{background:#efe9f6;border-color:#d8cbe9;color:#6b4f9a;}
  .cal{border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--cream);}
  .calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .calHead b{font-size:14px;color:var(--red);}
  .calHead button{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:30px;font-weight:900;color:var(--red);}
  .calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .calGrid .wd{text-align:center;font-size:11px;font-weight:800;color:var(--sub);padding:2px 0;}
  .calGrid .wd.sun{color:#b23b3b;} .calGrid .wd.sat{color:#1f6fb2;}
  .day{height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);padding:0;}
  .day.today{border:2px solid var(--gold);}
  .day.off{background:#6b4f9a;border-color:#6b4f9a;color:#fff;font-weight:900;}
  .day.off::after{content:'휴';display:block;font-size:9px;line-height:1;margin-top:-1px;}
  .calCount{margin-top:6px;font-size:12.5px;font-weight:800;color:#6b4f9a;text-align:center;}
  .shareRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 14px 0;}
  .shareRow button{padding:11px 6px;border-radius:12px;border:1.5px solid var(--gold);background:#fff;font-family:inherit;font-size:14px;font-weight:900;color:var(--red);}
  .shareRow button.recv{border-color:var(--line);color:var(--ink);}
  .shareNote{margin:6px 14px 0;font-size:11.5px;color:var(--sub);text-align:center;}
  .tag.warn{background:rgba(214,120,20,.15);color:#c06a00;}
  .tag.exp{background:#b23b3b;color:#fff;}
  .alertBar{margin:8px 14px 0;padding:9px 12px;border-radius:12px;background:#fff4e5;border:1px solid #f1c98a;font-size:12.5px;font-weight:800;color:#a85b00;line-height:1.5;}
  .alertBar.red{background:#fdecec;border-color:#f0b4b4;color:#b23b3b;}
  .twoCol{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  input[type=tel],input[type=number]{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);font-size:16px;font-family:inherit;color:var(--ink);}
  .contactBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .contactBtns a{display:block;text-align:center;padding:11px;border-radius:10px;text-decoration:none;font-weight:900;font-size:14px;}
  .contactBtns a.call{background:#2f7d4f;color:#fff;} .contactBtns a.sms{background:#1f6fb2;color:#fff;}
  .contactBtns a.dis{opacity:.35;pointer-events:none;}
  .dday{font-size:12px;font-weight:800;margin-top:5px;}
  .toolRow{margin:10px 14px 0;}
  .toolRow button{width:100%;padding:12px;border-radius:12px;border:1.5px solid #6b4f9a;background:#f6f1fb;font-family:inherit;font-size:14.5px;font-weight:900;color:#6b4f9a;}
  .bigModal .modalBox{max-width:560px;padding:14px;}
  .offGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .offGrid .wd{text-align:center;font-size:11px;font-weight:800;color:var(--sub);padding:2px 0;}
  .offGrid .wd.sun{color:#b23b3b;} .offGrid .wd.sat{color:#1f6fb2;}
  .oc{min-height:62px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:2px 2px 3px;font-family:inherit;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden;}
  .oc .dn{font-size:11px;font-weight:900;color:var(--ink);}
  .oc .nm{font-size:9.5px;font-weight:800;color:#6b4f9a;background:#efe9f6;border-radius:3px;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .oc .top{display:flex;align-items:center;justify-content:space-between;gap:1px;}
  .oc .cnt{font-size:9px;font-weight:900;color:#fff;background:#6b4f9a;border-radius:6px;padding:0 3px;line-height:13px;}
  .oc .ev{font-size:9px;font-weight:900;border-radius:3px;padding:0 1px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;}
  .oc .ev.join{background:#1f6fb2;} .oc .ev.leave{background:#b23b3b;}
  .legend{display:flex;gap:10px;justify-content:center;margin:2px 0 8px;font-size:11px;font-weight:800;color:var(--sub);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:-1px;}
  .oc .more{font-size:9px;color:var(--sub);font-weight:800;}
  .oc.today{border:2px solid var(--gold);}
  .oc.sel{outline:2px solid #6b4f9a;}
  .offDetail{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f6f1fb;font-size:13.5px;font-weight:700;color:#4b3570;line-height:1.6;min-height:42px;}
  .offStat{margin-top:10px;font-size:12.5px;line-height:1.7;}
  .offStat b{color:#6b4f9a;}
  .role{flex-shrink:0;font-size:10px;font-weight:900;color:#5a4310;background:rgba(201,162,74,.22);border-radius:5px;padding:2px 4px;}
  .toolRow.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .toolRow .cfgBtn{border-color:var(--line);background:#fff;color:var(--ink);}
  .cfgRow{display:flex;gap:6px;align-items:center;margin-bottom:8px;}
  .cfgRow select{flex-shrink:0;width:58px;padding:10px 2px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);font-size:18px;}
  .cfgRow input{flex:1;min-width:0;}
  .cfgRow .cnt{flex-shrink:0;font-size:11px;color:var(--sub);font-weight:700;width:34px;text-align:center;}
  .cfgRow .x{flex-shrink:0;width:36px;height:40px;border-radius:9px;border:0;background:#fbeaea;color:#b23b3b;font-weight:900;font-size:15px;}
  .smallBtn{width:100%;padding:11px;border-radius:10px;border:1.5px dashed var(--gold);background:rgba(201,162,74,.08);color:var(--red);font-family:inherit;font-weight:800;font-size:13.5px;margin:2px 0 12px;}
  .cfgHint{font-size:11.5px;color:var(--sub);line-height:1.6;margin:6px 0 12px;}
  .searchWrap{margin:10px 14px 0;position:relative;}
  .searchWrap input{padding-left:38px;}
  .searchWrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;}
  .searchRes{margin:6px 14px 0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .searchRes button{display:flex;width:100%;gap:8px;align-items:center;padding:11px 12px;border:0;border-top:1px solid var(--line);background:#fff;font-family:inherit;text-align:left;font-size:14px;}
  .searchRes button:first-child{border-top:0;}
  .searchRes .st{flex-shrink:0;font-size:11px;font-weight:900;color:#fff;background:var(--red);border-radius:6px;padding:2px 6px;}
  .searchRes .sc{color:var(--sub);font-size:12px;margin-left:auto;}
  .shareRow.three{grid-template-columns:1fr 1fr 1fr;}
  .shareRow button.xls{border-color:#2f7d4f;color:#2f7d4f;}
  .payBox{border:1.5px solid #cfe3d6;background:#f3faf5;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.75;color:#24533a;}
  .payBox b{font-size:15px;}
  .payBox small{display:block;color:var(--sub);font-size:11px;line-height:1.5;margin-top:4px;}
  .backupBar{margin:8px 14px 0;padding:10px 12px;border-radius:12px;background:#eef5fd;border:1px solid #b9d4f1;font-size:12.5px;font-weight:800;color:#1f5f99;display:flex;align-items:center;gap:8px;}
  .backupBar span{flex:1;line-height:1.45;}
  .backupBar button{flex-shrink:0;border:0;border-radius:9px;background:#1f6fb2;color:#fff;font-family:inherit;font-weight:900;font-size:12.5px;padding:9px 10px;}
  .rrnHide{-webkit-text-security:disc;text-security:disc;letter-spacing:1px;}
  .eyeBtn{flex-shrink:0;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:0 10px;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--sub);}
  .filterBar{margin:-6px 14px 10px;padding:9px 12px;border-radius:12px;background:var(--red);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .filterBar span{flex:1;}
  .filterBar button{border:0;border-radius:8px;background:#fff;color:var(--red);font-family:inherit;font-weight:900;font-size:12px;padding:6px 10px;}
  .chk.daily.on{border-color:#c06a00;background:rgba(214,120,20,.1);color:#c06a00;}
  .chk.daily.on .box{background:#c06a00;border-color:#c06a00;}
  .addRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 14px 14px;}
  .addRow .addBtn{width:auto;margin:0;}
  .addRow .addBtn.daily{border-color:#e0a24a;color:#c06a00;background:rgba(214,120,20,.06);}
  .typeChips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
  .typeChips button{padding:11px 4px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:13px;font-weight:900;color:#9a9182;line-height:1.25;}
  .typeChips button small{display:block;font-size:10.5px;font-weight:700;}
  .typeChips button.on.ins{background:#2f7d4f;border-color:#2f7d4f;color:#fff;}
  .typeChips button.on.ins2{background:#0f8a8a;border-color:#0f8a8a;color:#fff;}
  .typeChips button.on.tax{background:#1f6fb2;border-color:#1f6fb2;color:#fff;}
  .typeChips button.on.daily{background:#c06a00;border-color:#c06a00;color:#fff;}
  .day.work{background:#c06a00;border-color:#c06a00;color:#fff;font-weight:900;}
  .day.work::after{content:'근무';display:block;font-size:8.5px;line-height:1;margin-top:-1px;}
  .dailyOnly{display:none;} .isDaily .dailyOnly{display:block;} .isDaily .notDaily{display:none;}
  /* 체크 버튼을 작게: 네모 칸 대신 색으로 표시 */
  .chk{padding:8px 5px !important;font-size:11.5px !important;}
  .chk .box{display:none !important;}
  .chk.on{background:var(--green) !important;color:#fff !important;border-color:var(--green) !important;}
  .chk.ins2.on{background:#0f8a8a !important;border-color:#0f8a8a !important;}
  .chk.tax.on{background:#1f6fb2 !important;border-color:#1f6fb2 !important;}
  .chk.daily.on{background:#c06a00 !important;border-color:#c06a00 !important;color:#fff !important;}
  .chk.permit.on{background:#6b4f9a !important;border-color:#6b4f9a !important;}
  .payChips{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .payChips button{padding:11px;border-radius:9px;border:1px solid #e4e8f0;background:#fff;font-family:inherit;font-size:13px;font-weight:700;color:#8b96a8;}
  .payChips button.on{background:#315bf5;border-color:#315bf5;color:#fff;}
  .monthlyOnly{display:none;} .isMonthly .monthlyOnly{display:block;} .isMonthly .hourlyOnly{display:none;}
  .isDaily .monthlyOnly{display:none !important;}
  .addBtn{display:block;width:calc(100% - 28px);margin:10px 14px 14px;padding:11px;border-radius:10px;border:1.5px dashed var(--gold);background:rgba(201,162,74,.08);color:var(--red);font-family:inherit;font-weight:800;font-size:13.5px;}

  .modalOverlay{position:fixed;inset:0;background:rgba(30,10,10,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
  .modalOverlay.show{display:flex;}
  .modalBox{background:#fff;border-radius:16px;max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:18px;}
  .modalBox h2{margin:0 0 14px;font-size:18px;color:var(--red);display:flex;align-items:center;gap:8px;}
  label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin:0 0 6px;}
  input[type=text],textarea{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);font-size:16px;font-family:inherit;color:var(--ink);}
  textarea{min-height:110px;resize:vertical;line-height:1.6;}
  .field{margin-bottom:14px;}
  .savedAt{font-size:11.5px;color:var(--sub);margin-top:6px;}
  .btnRow{display:flex;gap:8px;margin-top:4px;}
  .btnRow button{flex:1;padding:13px;border-radius:10px;border:none;font-weight:800;font-family:inherit;font-size:14.5px;}
  .bGray{background:var(--line);color:var(--ink);}
  .bRed{background:var(--red);color:#fff;}
  .delLink{display:block;margin:14px auto 0;border:0;background:none;color:#b23b3b;font-family:inherit;font-size:12.5px;font-weight:700;text-decoration:underline;}

  .saveBar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(250,246,238,.97);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;}

<script>

function setPeopleView(overview){
 document.querySelector('.appMain').classList.toggle('overviewMode',overview);
 document.getElementById('allViewBtn').classList.toggle('active',overview);
 document.getElementById('detailViewBtn').classList.toggle('active',!overview);
 render();
}
function openStorePeople(id){switchStore(id);setPeopleView(false);window.scrollTo({top:0,behavior:'smooth'});}
function renderPeopleOverview(){
 const area=document.getElementById('peopleOverview');if(!area)return;
 area.replaceChildren();
 let total=0;STORES.forEach(st=>st.sections.forEach(sec=>(allData[st.id][sec.id]||[]).forEach(p=>{if(p.name&&!isLeft(p))total++;})));
 const intro=document.createElement('div');intro.className='overviewIntro';
 const heading=document.createElement('h2');heading.textContent=STORES.length+'개 매장 · 직원 '+total+'명';intro.append(heading);
 const sub=document.createElement('span');sub.textContent='이름을 누르면 상세 정보';intro.append(sub);area.append(intro);
 const grid=document.createElement('div');grid.className='peopleGrid';area.append(grid);
 STORES.forEach(st=>{
  const card=document.createElement('section');card.className='peopleCard';
  const top=document.createElement('div');top.className='peopleCardTop';
  const title=document.createElement('button');title.textContent=st.name+'점';title.onclick=()=>openStorePeople(st.id);top.append(title);
  const count=document.createElement('span');count.textContent=st.sections.flatMap(sec=>allData[st.id][sec.id]||[]).filter(p=>p.name&&!isLeft(p)).length+'명';top.append(count);card.append(top);
  st.sections.forEach(sec=>{
   const part=document.createElement('div');part.className='peoplePart';const label=document.createElement('h3');label.textContent=sec.name;part.append(label);
   const people=allData[st.id][sec.id]||[];
   people.forEach((p,i)=>{
    if(isLeft(p))return;
    const button=document.createElement('button');button.className='personQuick';button.title=p.name ? p.name+' 상세 정보' : '직원 정보 등록';
    const dot=document.createElement('span');dot.className='personDot'+(isOffToday(p)?' resting':isIn(p)?' working':'');button.append(dot);
    if(p.role){const role=document.createElement('span');role.className='personRole';role.textContent=p.role;button.append(role);}
    const nm=document.createElement('span');nm.className='personName'+(!p.name?' blank':'')+(permitNotReady(p)?' noPermit':'');nm.textContent=p.name||'미등록';button.append(nm);
    button.onclick=()=>{switchStore(st.id);openMemo(sec.id,i);};part.append(button);
   });
   if(!part.querySelector('button')){const none=document.createElement('div');none.className='emptyPart';none.textContent='등록된 직원 없음';part.append(none);}card.append(part);
  });
  const foot=document.createElement('button');foot.className='peopleCardFoot';foot.textContent='상세 관리 →';foot.onclick=()=>openStorePeople(st.id);card.append(foot);grid.append(card);
 });
 const hint=document.createElement('p');hint.className='overviewHint';hint.innerHTML='● 초록: 출근 · 보라: 오늘 휴무 · 회색: 출근 미체크 또는 미등록<br><b style="color:#e07000">주황 이름</b>: 워킹퍼밋 준비 안 됨 (내국인은 상세 정보에서 "내국인" 선택)';area.append(hint);
}

const KEY = 'cwy_staff_all_v1';
const OLD_GURO_KEY = 'cwy_staff_guro_v1';
const KITCHEN = {emo:'🍳', person:'🧑‍🍳'}, DISH = {emo:'🧽', person:'🧑‍🔧'}, HALL = {emo:'🍽️', person:'🙋'};
const DEFAULT_STORES = [
  {id:'guro', name:'구로', sections:[
    Object.assign({id:'back',  name:'뒷주방', count:3}, {emo:'🔪', person:'👨‍🍳'}),
    Object.assign({id:'front', name:'앞주방', count:6}, KITCHEN),
    Object.assign({id:'hall',  name:'홀 서빙', count:4}, HALL)]},
  {id:'jongno', name:'종로', sections:[
    Object.assign({id:'kitchen', name:'주방', count:4}, KITCHEN),
    Object.assign({id:'dish',    name:'설거지', count:1}, DISH),
    Object.assign({id:'hall',    name:'홀 서빙', count:2}, HALL)]},
  {id:'yeouido', name:'여의도', sections:[
    Object.assign({id:'kitchen', name:'주방', count:4}, KITCHEN),
    Object.assign({id:'dish',    name:'설거지', count:1}, DISH),
    Object.assign({id:'hall',    name:'홀 서빙', count:2}, HALL)]},
  {id:'gasan', name:'가산', sections:[
    Object.assign({id:'kitchen', name:'주방', count:3}, KITCHEN),
    Object.assign({id:'hall',    name:'홀 서빙', count:2}, HALL)]},
  {id:'yeongdeungpo', name:'영등포', sections:[
    Object.assign({id:'kitchen', name:'주방', count:3, roles:['부장','차장','차장']}, KITCHEN),
    Object.assign({id:'dish',    name:'설거지', count:1}, DISH),
    Object.assign({id:'hall',    name:'홀 서빙', count:2}, HALL)]}
];
const SEC_EMOJIS = ['🔪','🍳','🍣','🥩','🍜','🧽','🍽️','💁','🍺','🧾','🚚','👔'];
const PERSON_BY_EMO = {'🧽':'🧑‍🔧','🍽️':'🙋','💁':'🙋','🍺':'🙋','🧾':'🙋','🚚':'🙋','👔':'🙋'};
let STORES = [];
let storeId = 'guro';
try{ storeId = localStorage.getItem('cwy_staff_store') || 'guro'; }catch(e){}
let SECTIONS = [];
const CHECKS = [
  {id:'permit', label:'퍼밋', full:'워킹퍼밋'},
  {id:'ins',    label:'4대', full:'4대보험'},
  {id:'ins2',   label:'2대', full:'2대보험'},
  {id:'tax',    label:'3.3', full:'3.3%'},
  {id:'daily',  label:'일용', full:'일용직'}
];
const TYPES = ['ins','ins2','tax','daily'];   // 근로자 / 소득세 / 일용직 — 한 사람에 하나만
const TYPE_NAME = {ins:'근로자명단 (4대보험)', ins2:'2대보험명단 (고용·산재)', tax:'소득세명단 (3.3%)', daily:'일용직명단', none:'구분 안 된 직원'};
function staffType(p){ return p.daily ? 'daily' : (p.ins ? 'ins' : (p.ins2 ? 'ins2' : (p.tax ? 'tax' : 'none'))); }
let listFilter = '';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function blank(role){ return {id:uid(), role:role||'', updatedAt:Date.now(), name:'', memo:'', memoAt:0, permit:false, tax:false, ins:false, joinDate:'', leaveDate:'', off:[], workDays:[], dayWage:'', daily:false, phone:'', permitExp:'', wage:'', hours:'', rrn:''}; }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function cfgFromDefaults(){
  return {at:0, stores: DEFAULT_STORES.map(st=>({id:st.id, name:st.name, sections: st.sections.map(sec=>({id:sec.id, name:sec.name, emo:sec.emo, person:sec.person}))}))};
}
/* 매장·파트 구성을 데이터와 맞추고 빈 칸 만들기 */
function ensureStructure(all){
  if(!all.__cfg || !Array.isArray(all.__cfg.stores)) all.__cfg = cfgFromDefaults();
  // 기본 매장 중 없는 매장(예: 영등포)은 추가
  DEFAULT_STORES.forEach(ds=>{
    if(!all.__cfg.stores.some(x=>x.id===ds.id) && !(all.__cfg.removed||[]).includes(ds.id))
      all.__cfg.stores.push({id:ds.id, name:ds.name, sections: ds.sections.map(sec=>({id:sec.id, name:sec.name, emo:sec.emo, person:sec.person}))});
  });
  all.__cfg.stores.forEach(st=>{
    all[st.id] = all[st.id] || {};
    const def = DEFAULT_STORES.find(x=>x.id===st.id);
    st.sections.forEach(sec=>{
      if(!Array.isArray(all[st.id][sec.id])){
        const d = def && def.sections.find(x=>x.id===sec.id);
        const n = d ? d.count : 1;
        all[st.id][sec.id] = Array.from({length:n}, (_,k)=>Object.assign(blank(d && d.roles ? d.roles[k] : ''), {id: st.id+'_'+sec.id+'_'+k, updatedAt:0}));
      }
    });
  });
  // 한 번만 적용: 모든 매장 홀에 알바 칸, 영등포 주방 스끼 · 설거지 파출
  all.__mig = all.__mig || {};
  if(!all.__mig.alba1){
    all.__cfg.stores.forEach(st=>{
      const hall = all[st.id] && all[st.id].hall;
      if(Array.isArray(hall) && !hall.some(p=>p.role==='알바')) hall.push(Object.assign(blank('알바'), {id: st.id+'_hall_alba', updatedAt:0}));
    });
    all.__mig.alba1 = true;
  }
  if(!all.__mig.ydp1 && all.yeongdeungpo){
    const k = all.yeongdeungpo.kitchen, d = all.yeongdeungpo.dish;
    if(Array.isArray(k) && !k.some(p=>p.role==='스끼')) k.push(Object.assign(blank('스끼'), {id:'yeongdeungpo_kitchen_ski', updatedAt:0}));
    if(Array.isArray(d) && !d.some(p=>p.role==='파출')){
      const empty = d.find(p=>!p.role && !p.name);
      if(empty) empty.role = '파출'; else d.push(Object.assign(blank('파출'), {id:'yeongdeungpo_dish_pachul', updatedAt:0}));
    }
    all.__mig.ydp1 = true;
  }
  if(!all.__mig.pachul1){
    all.__cfg.stores.forEach(st=>{
      const kid = st.sections.some(x=>x.id==='kitchen') ? 'kitchen' : (st.sections.some(x=>x.id==='front') ? 'front' : null);
      const arr = kid && all[st.id] && all[st.id][kid];
      if(Array.isArray(arr) && !arr.some(p=>p.role==='파출')) arr.push(Object.assign(blank('파출'), {id: st.id+'_'+kid+'_pachul', updatedAt:0}));
    });
    all.__mig.pachul1 = true;
  }
  STORES = all.__cfg.stores;
  if(!STORES.some(x=>x.id===storeId)) storeId = STORES[0].id;
  SECTIONS = STORES.find(x=>x.id===storeId).sections;
}
function loadAll(){
  let all = {};
  try{ all = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){}
  if(!all.guro){ try{ const old = JSON.parse(localStorage.getItem(OLD_GURO_KEY) || 'null'); if(old && old.back) all.guro = old; }catch(e){} }
  ensureStructure(all);
  return all;
}
const allData = loadAll();
delete allData.__att;
let data = allData[storeId];
function touch(p){ p.updatedAt = Date.now(); }
const SAVED_AT_KEY = 'cwy_staff_saved_at';
function showSaved(){
  const el = document.getElementById('saveInfo'); if(!el) return;
  let t = 0; try{ t = Number(localStorage.getItem(SAVED_AT_KEY)) || 0; }catch(e){}
  el.classList.remove('dirty');
  el.innerHTML = '<b>✓ 저장됨</b>' + (lastAction ? ' · ' + esc(lastAction) : '') + (t ? '<br>' + new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '');
}
function saveAll(){
  if(persist()){
    const m = today().slice(0,7), L = logs().filter(x=>x.date && x.date.slice(0,7)===m);
    toast(`저장 완료 · 이번 달 입사 ${L.filter(x=>x.type==='join').length}명 · 퇴사 ${L.filter(x=>x.type==='leave').length}명`);
  }
}
function persist(){
  try{
    localStorage.setItem(KEY, JSON.stringify(allData));
    localStorage.setItem(SAVED_AT_KEY, String(Date.now()));
    showSaved();
    return true;
  }
  catch(e){ toast('저장 공간이 부족해요'); return false; }
}
// 폰이 자동으로 데이터를 지우지 않도록 요청
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* 출근 체크는 화면에서만 쓰고 저장하지 않음 (앱을 다시 열면 비어 있음) */
const attNow = {};
function attMap(){ return attNow; }
/* 입·퇴사 기록 (저장할 때 입사/퇴사 구분과 날짜가 함께 남음) */
function logs(){
  allData.__log = allData.__log || {};
  if(!allData.__log[storeId]){
    // 기존 입사일·퇴사일로 처음 기록 만들기
    const arr = [];
    SECTIONS.forEach(sec=>data[sec.id].forEach(p=>{
      if(p.joinDate)  arr.push({staffId:p.id, name:p.name, sec:sec.name, type:'join',  date:p.joinDate,  at:Date.now()});
      if(p.leaveDate) arr.push({staffId:p.id, name:p.name, sec:sec.name, type:'leave', date:p.leaveDate, at:Date.now()});
    }));
    allData.__log[storeId] = arr;
  }
  return allData.__log[storeId];
}
function setLog(p, secName, type, date){
  const L = logs();
  const idx = L.findIndex(x=>x.staffId===p.id && x.type===type);
  if(!date){ if(idx>=0) L.splice(idx,1); return; }
  const e = {staffId:p.id, name:p.name, sec:secName, type, date, at:Date.now()};
  if(idx>=0) L[idx] = e; else L.push(e);
}
let lastAction = '';
function isOffToday(p){ return Array.isArray(p.off) && p.off.includes(today()); }
function offInMonth(p, ym){ return (p.off||[]).filter(d=>d.slice(0,7)===ym).length; }
let calMonth = '', calOff = [], calWork = [], mType = 'none', mPayType = 'hourly';
function setPayType(t){
  mPayType = t;
  document.querySelectorAll('#mPayType button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  document.getElementById('memoModal').classList.toggle('isMonthly', t==='monthly');
  updPay();
}
function setMType(t){
  mType = (mType===t ? 'none' : t);
  document.querySelectorAll('#mType button').forEach(b=>b.classList.toggle('on', b.classList.contains(mType)));
  document.getElementById('memoModal').classList.toggle('isDaily', mType==='daily');
  document.getElementById('calLabel').textContent = mType==='daily' ? '근무일 (일한 날을 누르세요)' : '휴무일 (날짜를 누르면 휴무 체크)';
  renderCal();
}
function renderCal(){
  const [y,m] = calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1).getDay(), days = new Date(y, m, 0).getDate(), t = today();
  let h = `<div class="calHead"><button onclick="calMove(-1)">◀</button><b>${y}년 ${m}월</b><button onclick="calMove(1)">▶</button></div><div class="calGrid">`;
  h += ['일','월','화','수','목','금','토'].map((w,i)=>`<div class="wd ${i===0?'sun':(i===6?'sat':'')}">${w}</div>`).join('');
  for(let i=0;i<first;i++) h += '<div></div>';
  for(let d=1; d<=days; d++){
    const ds = calMonth + '-' + String(d).padStart(2,'0');
    const dl = mType==='daily';
    h += `<button class="day ${dl ? (calWork.includes(ds)?'work':'') : (calOff.includes(ds)?'off':'')} ${ds===t?'today':''}" onclick="calToggle('${ds}')">${d}</button>`;
  }
  const cnt = (mType==='daily' ? calWork : calOff).filter(x=>x.slice(0,7)===calMonth).length;
  h += `</div><div class="calCount" style="${mType==='daily'?'color:#c06a00':''}">${m}월 ${mType==='daily'?'근무':'휴무'} ${cnt}일</div>`;
  document.getElementById('mCal').innerHTML = h;
  if(typeof updPay==='function' && cur) updPay();
}
function calMove(n){
  let [y,m] = calMonth.split('-').map(Number); m += n;
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  calMonth = y + '-' + String(m).padStart(2,'0'); renderCal();
}
function calToggle(ds){
  const L = mType==='daily' ? calWork : calOff;

/* ---------- 급여 예상 ---------- */
function workDays(p, ym, offList){
  const [y,m] = ym.split('-').map(Number), days = new Date(y, m, 0).getDate();
  let n = 0;
  for(let d=1; d<=days; d++){
    const ds = ym + '-' + String(d).padStart(2,'0');
    if(staffActiveOn(p, ds) && !(offList||p.off||[]).includes(ds)) n++;
  }
  return n;
}
function activeDays(p, ym){
  const [y,m] = ym.split('-').map(Number), days = new Date(y, m, 0).getDate();
  let n = 0;
  for(let d=1; d<=days; d++){ if(staffActiveOn(p, ym + '-' + String(d).padStart(2,'0'))) n++; }
  return {n, days};
}
function calcPay(p, ym, offList){
  const wage = Number(p.wage)||0, hrs = Number(p.dayHours)||0;
  const wd = workDays(p, ym, offList);
  let gross, monthly = 0, act = null;
  if(p.payType==='monthly'){
    monthly = Number(p.monthly)||0; act = activeDays(p, ym);
    gross = act.n===act.days ? monthly : Math.floor(monthly * act.n / act.days / 10) * 10;
  } else gross = Math.round(wage * hrs * wd);
  const tax = p.tax ? Math.floor(gross * 0.03 / 10) * 10 + Math.floor(gross * 0.003 / 10) * 10 : 0;
  return {wage, hrs, wd, gross, tax, net: gross - tax, monthly, act, isMonthly: p.payType==='monthly'};
}
/* 일용근로소득세: (일당 − 15만원) × 6% × 45%(세액공제 후), 1,000원 미만은 안 냄(소액부징수) · 지방세 10% */
function dailyTax(dayWage){
  const w = Number(dayWage)||0;
  let it = Math.floor(Math.max(0, w - 150000) * 0.06 * 0.45 / 10) * 10;
  if(it < 1000) it = 0;
  const lt = Math.floor(it * 0.1 / 10) * 10;
  return {it, lt};
}
function calcDaily(p, ym, workList){
  const days = (workList || p.workDays || []).filter(d=>d.slice(0,7)===ym).sort();
  const w = Number(p.dayWage)||0, t = dailyTax(w), n = days.length;
  const gross = w * n, it = t.it * n, lt = t.lt * n;
  return {days, n, w, gross, it, lt, net: gross - it - lt, perIt:t.it, perLt:t.lt};
}

const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){   // files: [{name, data:Uint8Array}] — 압축 없이 묶기

    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new Uint8Array([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0)]);
    parts.push(lh, nm, f.data);
    central.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
    off += lh.length + nm.length + sz;
  });
  const cdSize = central.reduce((a,x)=>a+x.length,0);
  const end = new Uint8Array([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(off), ...u16(0)]);

function colName(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }

  const body = rows.map((r,ri)=>`<row r="${ri+1}">` + r.map((v,ci)=>{

    return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xEsc(v)}</t></is></c>`;
  }).join('') + '</row>').join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${body}</sheetData></worksheet>`;

function buildXlsx(sheets){

    f('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`),
    f('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>` + sheets.map((sh,i)=>`<sheet name="${xEsc(sh.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('') + `</sheets></workbook>`),

  touch(p);
  const c = CHECKS.find(x=>x.id===key);
  if(persist()) toast(p[key] ? (TYPES.includes(key) ? TYPE_NAME[key] + '에 넣었어요' : c.full + ' 체크됨') : c.full + ' 체크 해제');
  render();
}
function setFilter(f){ listFilter = (listFilter===f ? '' : f); render(); window.scrollTo({top: document.getElementById('sections').offsetTop - 70, behavior:'smooth'}); }
function addStaff(sec, kind){
  const nb = blank(kind==='daily' ? '일용' : '');
  if(kind==='daily') nb.daily = true;
  data[sec].push(nb);
  persist(); render();
  openMemo(sec, data[sec].length-1);
}

let cur = null, mPermitSt = 'no', origRole = '';
function setPermitSt(v){
  mPermitSt = v;
  document.querySelectorAll('#mPermitSt button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
}
function fillMove(){
  const sel = document.getElementById('mMove');
  sel.innerHTML = STORES.map(st=>`<optgroup label="${esc(st.name)}점">` + st.sections.map(sec=>`<option value="${st.id}|${sec.id}">${esc(st.name)}점 · ${esc(sec.name)}${st.id===storeId && sec.id===cur.sec ? ' (지금 위치)' : ''}</option>`).join('') + '</optgroup>').join('');
  sel.value = storeId + '|' + cur.sec;
}
function openMemo(sec, i){
  cur = {sec, i};
  const s = SECTIONS.find(x=>x.id===sec), p = data[sec][i];
  document.getElementById('mEmo').textContent = s.emo;
  document.getElementById('mTitle').textContent = s.name + ' · ' + (p.role ? p.role + ' ' : '') + (p.name || '새 직원');
  document.getElementById('mName').value = p.name;
  document.getElementById('mRole').value = p.role || '';
  origRole = p.role || '';
  fillMove();
  setPermitSt(p.local ? 'local' : (p.permit ? 'yes' : 'no'));
  const rr = document.getElementById('mRrn'); rr.value = p.rrn || ''; rr.classList.add('rrnHide');
  document.getElementById('rrnEye').textContent = '👁 보기'; fmtRrn(rr);
  document.getElementById('mMemo').value = p.memo;
  document.getElementById('mIn').value = p.joinDate || '';
  document.getElementById('mOut').value = p.leaveDate || '';
  document.getElementById('mPhone').value = p.phone || '';
  document.getElementById('mPermitExp').value = p.permitExp || '';
  document.getElementById('mWage').value = p.wage || '';
  document.getElementById('mHours').value = p.hours || '';
  document.getElementById('mDayHours').value = p.dayHours || '';
  document.getElementById('mMonthly').value = p.monthly || '';
  updContact(); updDday();
  calMonth = viewMonth; calOff = (p.off||[]).slice(); calWork = (p.workDays||[]).slice();
  document.getElementById('mDayWage').value = p.dayWage || '';
  mType = 'x'; setMType(staffType(p));
  setPayType(p.payType==='monthly' ? 'monthly' : 'hourly');
  updPay();
  document.getElementById('mSaved').textContent = p.memoAt ? '마지막 저장: ' + new Date(p.memoAt).toLocaleString('ko-KR') : '';
  document.getElementById('memoModal').classList.add('show');
}
function closeMemo(){ document.getElementById('memoModal').classList.remove('show'); cur = null; }
function saveMemo(){
  if(!cur) return;
  const p = data[cur.sec][cur.i];
  p.name = document.getElementById('mName').value.trim();
  p.role = document.getElementById('mRole').value.trim();
  const rv = document.getElementById('mRrn').value.trim();
  if(rv && rv.replace(/\D/g,'').length !== 13 && !confirm('주민등록번호가 13자리가 아니에요. 그대로 저장할까요?')) return;
  p.rrn = rv;
  p.memo = document.getElementById('mMemo').value;
  p.phone = document.getElementById('mPhone').value.trim();
  p.permitExp = document.getElementById('mPermitExp').value;
  p.local = (mPermitSt==='local'); p.permit = (mPermitSt==='yes');
  p.wage = document.getElementById('mWage').value;
  p.hours = document.getElementById('mHours').value.trim();
  p.dayHours = document.getElementById('mDayHours').value;
  p.monthly = document.getElementById('mMonthly').value;
  p.payType = mPayType;
  p.dayWage = document.getElementById('mDayWage').value;
  TYPES.forEach(t=>{ p[t] = (mType===t); });
  if(mType==='daily' && !p.role) p.role = '일용';
  const cutW = new Date(); cutW.setFullYear(cutW.getFullYear()-2);
  p.workDays = calWork.filter(d=>d >= cutW.toISOString().slice(0,10)).sort();
  const jin = document.getElementById('mIn').value, jout = document.getElementById('mOut').value;
  if(jin && jout && jout < jin){ toast('퇴사일이 입사일보다 빨라요'); return; }
  const secName = SECTIONS.find(x=>x.id===cur.sec).name;
  if(jin !== (p.joinDate||''))  { setLog(p, secName, 'join', jin);  lastAction = jin ? `${p.name||'직원'} 입사 ${fmtD(jin)}` : `${p.name||'직원'} 입사 기록 취소`; }
  if(jout !== (p.leaveDate||'')){ setLog(p, secName, 'leave', jout); lastAction = jout ? `${p.name||'직원'} 퇴사 ${fmtD(jout)}` : `${p.name||'직원'} 퇴사 기록 취소`; }
  p.joinDate = jin; p.leaveDate = jout;
  // 휴무일 저장 (지난 1년치만 보관)
  const cut = new Date(); cut.setFullYear(cut.getFullYear()-1);
  const cutS = cut.toISOString().slice(0,10);
  p.off = calOff.filter(d=>d >= cutS).sort();
  logs().forEach(x=>{ if(x.staffId===p.id) x.name = p.name; });
  p.memoAt = Date.now(); touch(p);
  const moved = moveStaffIfNeeded(p);
  if(persist()){ toast(moved ? moved + '(으)로 옮겼어요' : '저장되었습니다'); closeMemo(); render(); }
}
/* 위치 이동: 새 자리로 옮기고, 원래 자리는 빈 칸으로 둠 */
function moveStaffIfNeeded(p){
  const dest = document.getElementById('mMove').value;
  if(!dest || dest === storeId + '|' + cur.sec) return '';
  const [dst, dsec] = dest.split('|');
  const fromStore = storeId, fromSec = cur.sec;
  // 원래 자리는 같은 직급의 빈 칸으로
  allData[fromStore][fromSec][cur.i] = blank(origRole);
  // 두 폰 합치기에서 중복되지 않게 새 번호로 옮김
  const oldId = p.id;
  allData.__del = allData.__del || {}; allData.__del[oldId] = Date.now();
  p.id = uid(); touch(p);
  const arr = allData[dst][dsec] = allData[dst][dsec] || [];
  let k = arr.findIndex(q=>isEmptyStaff(q) && (q.role||'')===(p.role||''));
  if(k < 0) k = arr.findIndex(q=>isEmptyStaff(q) && !q.role);
  if(k >= 0) arr[k] = p; else arr.push(p);
  // 입·퇴사 기록도 함께 옮김
  allData.__log = allData.__log || {};
  const secName = STORES.find(x=>x.id===dst).sections.find(x=>x.id===dsec).name;
  const fromL = allData.__log[fromStore] || [];
  const mine = fromL.filter(x=>x.staffId===oldId);
  allData.__log[fromStore] = fromL.filter(x=>x.staffId!==oldId);
  allData.__log[dst] = (allData.__log[dst] || []).concat(mine.map(x=>Object.assign(x, {staffId:p.id, sec:secName})));
  const stName = STORES.find(x=>x.id===dst).name;
  return stName + '점 ' + secName;
}
function deleteStaff(){
  if(!cur) return;
  const p = data[cur.sec][cur.i];
  if(!confirm((p.name || '이 직원') + ' 칸을 삭제할까요?\n메모와 체크는 지워지고, 입·퇴사 기록은 남습니다.')) return;
  allData.__del = allData.__del || {}; allData.__del[p.id] = Date.now();
  data[cur.sec].splice(cur.i, 1);
  persist(); closeMemo(); render();
  toast('삭제되었습니다');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__t); window.__t = setTimeout(()=>t.classList.remove('show'), 1600);
}

showSaved();

/* ================= 공유 보내기 / 받기 (서버 없이 파일로) ================= */
const FILE_TAG = 'cwy-staff-list';
function stamp(){ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0'); }
async function exportData(){
  persist();
  const hasRrn = STORES.some(st=>st.sections.some(sec=>(allData[st.id][sec.id]||[]).some(p=>p.rrn)));
  const withRrn = hasRrn ? confirm('보내는 파일에 주민등록번호도 넣을까요?\n\n[확인] 넣기\n[취소] 주민번호만 빼고 보내기') : false;
  const payload = {app:FILE_TAG, ver:2, exportedAt:Date.now(), data:allData};
  delete payload.data.__att;
  let text = JSON.stringify(payload);
  if(hasRrn && !withRrn){
    const copy = JSON.parse(text);
    Object.keys(copy.data).forEach(k=>{ if(k.startsWith('__')) return; Object.values(copy.data[k]||{}).forEach(arr=>Array.isArray(arr) && arr.forEach(p=>{ if(p.rrn){ p.rrn=''; p.rrnOmitted=true; } })); });
    text = JSON.stringify(copy);
  }
  const name = '직원리스트_' + stamp() + '.json';
  const file = new File([text], name, {type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'직원 리스트', text:'직원 리스트 저장 파일입니다. 앱에서 ↓ 받기로 열어주세요.'});
      markSent(); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  // 공유가 안 되는 폰: 파일로 내려받기
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  markSent();
  toast('파일을 내려받았어요. 카톡으로 보내주세요');
}
function markSent(){
  try{ localStorage.setItem('cwy_staff_sent_at', String(Date.now())); }catch(e){}
  showShareNote(); renderBackup();
}
/* 7일 넘게 백업(보내기)을 안 했으면 알림 */
function renderBackup(){
  const el = document.getElementById('backupArea'); if(!el) return;
  let sent = 0, saved = 0;
  try{ sent = Number(localStorage.getItem('cwy_staff_sent_at'))||0; saved = Number(localStorage.getItem(SAVED_AT_KEY))||0; }catch(e){}
  const hasData = STORES.some(st=>st.sections.some(sec=>(allData[st.id][sec.id]||[]).some(p=>p.name)));
  const days = sent ? Math.floor((Date.now()-sent)/86400000) : null;
  const need = hasData && (sent ? (days >= 7 && saved > sent) : true);
  el.innerHTML = need ? `<div class="backupBar"><span>💾 ${sent ? days + '일째 백업을 안 했어요' : '아직 백업을 한 번도 안 했어요'}<br><small style="font-weight:600">폰을 바꾸거나 앱이 지워지면 기록이 사라질 수 있어요</small></span><button onclick="exportData()">지금 보내기</button></div>` : '';
}
function showShareNote(){
  let sent = 0, recv = 0;
  try{ sent = Number(localStorage.getItem('cwy_staff_sent_at'))||0; recv = Number(localStorage.getItem('cwy_staff_recv_at'))||0; }catch(e){}
  const f = t=>new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('shareNote').textContent =
    (sent ? '마지막 보냄 ' + f(sent) : '아직 보낸 적 없음') + (recv ? ' · 마지막 받음 ' + f(recv) : '');
}
let pendingImport = null;
function importData(input){
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    let obj;
    try{ obj = JSON.parse(r.result); }catch(e){ toast('직원 리스트 파일이 아니에요'); return; }
    if(!obj || obj.app!==FILE_TAG || !obj.data){ toast('직원 리스트 파일이 아니에요'); return; }
    pendingImport = obj;
    document.getElementById('impWhen').textContent = new Date(obj.exportedAt).toLocaleString('ko-KR') + ' 에 보낸 파일';
    document.getElementById('impModal').classList.add('show');
  };
  r.onerror = ()=>toast('파일을 열 수 없어요');
  r.readAsText(f);
}
function closeImp(){ document.getElementById('impModal').classList.remove('show'); pendingImport = null; }
function isEmptyStaff(p){ return !p.name && !p.memo && !p.phone && !p.joinDate && !p.leaveDate && !(p.off||[]).length && !p.permit && !p.tax && !p.ins && !p.ins2 && !p.wage && !p.monthly && !p.permitExp && !p.rrn && !p.daily && !(p.workDays||[]).length; }
function stamp2(p){ return Number(p.updatedAt || p.memoAt || 0); }
/* 합치기: 직원마다 더 최근에 고친 쪽을 남김 */
function mergeData(mine, theirs){
  const out = JSON.parse(JSON.stringify(mine));
  const del = Object.assign({}, mine.__del||{});
  Object.entries(theirs.__del||{}).forEach(([k,v])=>{ if(!del[k] || v > del[k]) del[k] = v; });
  out.__del = del;
  // 매장·파트 구성: 둘 다 합치고 이름은 더 최근 설정 따름
  const cA = mine.__cfg || {stores:[]}, cB = theirs.__cfg || {stores:[]};
  const newer = (cB.at||0) > (cA.at||0) ? cB : cA, older = newer===cA ? cB : cA;
  const cfg = JSON.parse(JSON.stringify(newer));
  cfg.removed = Array.from(new Set([...(cA.removed||[]), ...(cB.removed||[])]));
  older.stores.forEach(st=>{
    if(cfg.removed.includes(st.id)) return;
    let t = cfg.stores.find(x=>x.id===st.id);
    if(!t){ cfg.stores.push(JSON.parse(JSON.stringify(st))); return; }
    st.sections.forEach(sec=>{ if(!t.sections.some(x=>x.id===sec.id)) t.sections.push(JSON.parse(JSON.stringify(sec))); });
  });
  cfg.stores = cfg.stores.filter(st=>!cfg.removed.includes(st.id));
  out.__cfg = cfg;
  let added = 0, updated = 0;
  cfg.stores.forEach(st=>{
    out[st.id] = out[st.id] || {};
    st.sections.forEach(sec=>{
      const A = (mine[st.id]||{})[sec.id] || [], B = (theirs[st.id]||{})[sec.id] || [];
      const list = A.map(p=>Object.assign({}, p));
      const idx = new Map(list.map((p,k)=>[p.id,k]));
      const usedEmpty = new Set();
      B.forEach(p=>{
        if(idx.has(p.id)){
          const k = idx.get(p.id);
          if(stamp2(p) > stamp2(list[k])){
            const keepRrn = list[k].rrn;
            list[k] = Object.assign({}, p);
            if(p.rrnOmitted && keepRrn) list[k].rrn = keepRrn;   // 주민번호 빼고 보낸 파일이면 이 폰 주민번호 유지
            delete list[k].rrnOmitted;
            if(!isEmptyStaff(p)) updated++;
          }
          return;
        }
        if(isEmptyStaff(p)) return;                 // 빈 칸은 가져오지 않음
        // 같은 직급의 빈 칸이 있으면 그 자리에, 없으면 뒤에 추가
        let k = list.findIndex((q,j)=>!usedEmpty.has(j) && isEmptyStaff(q) && (q.role||'')===(p.role||''));
        if(k<0) k = list.findIndex((q,j)=>!usedEmpty.has(j) && isEmptyStaff(q) && !q.role);
        if(k>=0){ usedEmpty.add(k); list[k] = p; } else list.push(p);
        added++;
      });
      out[st.id][sec.id] = list.filter(p=>!(del[p.id] && del[p.id] >= stamp2(p)));
    });
  });
  // 입·퇴사 기록: 직원 정보 기준으로 다시 맞추고, 삭제된 직원 기록은 둘 다 합침
  out.__log = {};
  cfg.stores.forEach(st=>{
    const L = [], staff = [];
    st.sections.forEach(sec=>(out[st.id][sec.id]||[]).forEach(p=>staff.push({p, sec})));
    const live = new Set(staff.map(x=>x.p.id));
    const oldLogs = [...(((mine.__log||{})[st.id])||[]), ...(((theirs.__log||{})[st.id])||[])];
    staff.forEach(({p, sec})=>{
      ['join','leave'].forEach(type=>{
        const date = type==='join' ? p.joinDate : p.leaveDate;
        if(!date) return;
        const prev = oldLogs.filter(x=>x.staffId===p.id && x.type===type && x.date===date).sort((a,b)=>b.at-a.at)[0];
        L.push({staffId:p.id, name:p.name, sec:sec.name, type, date, at: prev ? prev.at : stamp2(p)});
      });
    });
    const seen = new Set();
    oldLogs.filter(x=>!live.has(x.staffId)).forEach(x=>{ const k = x.staffId+x.type; if(!seen.has(k)){ seen.add(k); L.push(x); } });
    out.__log[st.id] = L;
  });
  out.__mig = Object.assign({}, theirs.__mig||{}, mine.__mig||{});
  return {out, added, updated};
}
function doImport(mode){
  const obj = pendingImport; if(!obj) return;
  let next, msg;
  if(mode==='merge'){
    const r = mergeData(allData, obj.data);
    next = r.out; msg = `합치기 완료! 새 직원 ${r.added}명 · 바뀐 직원 ${r.updated}명 반영`;
  } else {
    if(!confirm('이 폰의 직원 리스트를 받은 내용으로 통째로 바꿀까요?')) return;
    next = obj.data; msg = '받은 내용으로 바꿨어요';
  }
  try{
    localStorage.setItem('cwy_staff_backup_before_import', localStorage.getItem(KEY) || '');
    localStorage.setItem(KEY, JSON.stringify(next));
    localStorage.setItem('cwy_staff_recv_at', String(Date.now()));
    localStorage.setItem(SAVED_AT_KEY, String(Date.now()));
  }catch(e){ toast('저장 공간이 부족해요'); return; }
  closeImp();
  alert(msg);
  location.reload();
}
showShareNote();
renderBackup();
/* 매달 자동으로 새 달 보여주기: 달이 바뀌거나 앱으로 돌아오면 이번 달로 */
let curMonth = today().slice(0,7);
function goThisMonth(){ viewMonth = today().slice(0,7); logOpen = false; render(); }
function checkNewMonth(force){
  const m = today().slice(0,7);
  if(m !== curMonth || (force && viewMonth !== m)){
    const changed = m !== curMonth;
    curMonth = m; goThisMonth();
    if(changed) toast(Number(m.slice(5,7)) + '월이 시작되었어요');
  }
}
setInterval(()=>checkNewMonth(false), 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkNewMonth(true); });

/* 홈 화면 설치 · 오프라인 */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
